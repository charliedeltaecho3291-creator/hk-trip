<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hong Kong Spots</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="HK Trip">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f6f5f2;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid-hairline:  #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent:         #d9343a; /* HK red */
    --good:           #006300;
    --star:           #e8a100;
    --series-1: #d9343a; /* 飲茶・点心 */
    --series-2: #eb6834; /* 麺・粥 */
    --series-3: #c98500; /* 茶餐廳 */
    --series-4: #8a4b2a; /* 焼味・煲仔飯 */
    --series-5: #4a3aa7; /* レストラン */
    --series-6: #e87ba4; /* スイーツ */
    --series-7: #1baf7a; /* カフェ */
    --series-8: #b07a3b; /* ベーカリー */
    --series-9: #2a78d6; /* バー */
    --series-10: #008300; /* 観光・買い物 */
    --series-11: #898781; /* 未分類 */
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid-hairline:  #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --accent:         #ef5a5f;
    --good:           #0ca30c;
    --star:           #f5b82e;
    --series-1: #ef5a5f;
    --series-2: #d95926;
    --series-3: #e0a400;
    --series-4: #c07a52;
    --series-5: #9085e9;
    --series-6: #d55181;
    --series-7: #199e70;
    --series-8: #c99a5f;
    --series-9: #3987e5;
    --series-10: #22b322;
    --series-11: #898781;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page-plane);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    color: var(--text-primary);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 14px 80px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  h1 { font-size: 21px; margin: 0 0 2px; }
  h1 .flag { margin-right: 4px; }
  .sub { color: var(--text-secondary); font-size: 12.5px; margin: 0; }
  .theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; flex: none;
  }

  .page-tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin:6px 0 14px; position: sticky; top: 0; background: var(--page-plane); z-index: 5; }
  .page-tab { flex:1; background:none; border:none; border-bottom:3px solid transparent; padding:10px 4px; font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .page-tab.active { color:var(--text-primary); border-bottom-color:var(--accent); }
  .page { display: none; }
  .page.active { display: block; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 10px; }
  .kpi .label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .kpi .value { font-size: 20px; font-weight: 700; }
  .kpi .value.up { color: var(--good); }
  .progress { height: 6px; background: var(--grid-hairline); border-radius: 3px; overflow: hidden; margin: -6px 0 16px; }
  .progress > div { height: 100%; background: var(--good); transition: width .3s; }

  .search {
    width: 100%; padding: 10px 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); margin-bottom: 10px;
  }
  .chip-heading { font-size: 12.5px; font-weight: 600; margin: 4px 0 6px; color: var(--text-secondary); }
  .chips { display: flex; gap: 6px; margin: 0 0 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    border: 1px solid var(--border); background: var(--surface-1);
    border-radius: 999px; padding: 6px 12px 6px 9px; font-size: 13px; cursor: pointer;
    color: var(--text-secondary); user-select: none; white-space: nowrap;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip.active { color: var(--text-primary); border-color: var(--text-primary); font-weight: 600; }
  .chip small { color: var(--text-muted); font-weight: 400; }
  .toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

  section.panel { margin-bottom: 22px; }
  .panel h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; }
  .panel h2 small { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden; border-left: 4px solid var(--cat, var(--series-11));
  }
  .card.visited { opacity: .55; }
  .card-main { display: flex; align-items: center; gap: 10px; padding: 11px 12px; cursor: pointer; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .card.visited .card-title { text-decoration: line-through; }
  .meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .meta .cat { color: var(--cat); font-weight: 600; }
  .meta .day { color: var(--accent); font-weight: 600; }
  .meta .memo { color: var(--text-secondary); }
  .icon-btn {
    border: none; background: none; font-size: 22px; line-height: 1; padding: 4px; cursor: pointer; color: var(--grid-hairline); flex: none;
  }
  .icon-btn.star.on { color: var(--star); }
  .icon-btn.check.on { color: var(--good); }
  .card-detail { display: none; padding: 0 12px 12px; border-top: 1px dashed var(--border); }
  .card.open .card-detail { display: block; }
  .field { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--text-secondary); }
  .field select, .field input {
    width: 100%; padding: 7px 8px; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary);
  }
  .map-btn {
    display: block; text-align: center; margin-top: 12px; padding: 10px; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; text-decoration: none;
  }
  .empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }

  .area-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .area-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .area-tile .name { font-size: 13.5px; font-weight: 600; }
  .area-tile .count { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .area-tile .bar { height: 4px; background: var(--grid-hairline); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .area-tile .bar > div { height: 100%; background: var(--good); }

  .note-box {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin: 18px 0; font-size: 12px; color: var(--text-secondary); line-height: 1.7;
  }
  .note-box b { color: var(--text-primary); }
  .link-btn { background: none; border: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
  @media (max-width: 420px) { .kpi .value { font-size: 18px; } .kpi .label { font-size: 10.5px; } }
</style>
</head>
<body class="viz-root">
<div class="wrap">
<header>
  <div>
    <h1><span class="flag">🇭🇰</span>Hong Kong Spots</h1>
    <p class="sub" id="subLine"></p>
  </div>
  <button class="theme-toggle" id="themeToggle">ダークモード</button>
</header>

<nav class="page-tabs" id="pageTabs">
  <button class="page-tab active" data-page="list">一覧</button>
  <button class="page-tab" data-page="area">エリア別</button>
  <button class="page-tab" data-page="plan">日別プラン</button>
</nav>

<div class="kpis">
  <div class="kpi"><div class="label">スポット</div><div class="value" id="kpiTotal">-</div></div>
  <div class="kpi"><div class="label">行った</div><div class="value up" id="kpiVisited">-</div></div>
  <div class="kpi"><div class="label">★ 絶対行く</div><div class="value" id="kpiStar">-</div></div>
  <div class="kpi"><div class="label">日程に入れた</div><div class="value" id="kpiPlanned">-</div></div>
</div>
<div class="progress"><div id="progressBar" style="width:0"></div></div>

<!-- 一覧 -->
<div class="page active" id="page-list">
  <input class="search" id="search" type="search" placeholder="店名で検索">
  <div class="chip-heading">カテゴリ</div>
  <div class="chips" id="catChips"></div>
  <div class="chip-heading">エリア</div>
  <div class="chips" id="areaChips"></div>
  <div class="toggles">
    <span class="chip" id="fStar">★ のみ</span>
    <span class="chip" id="fUnvisited">未訪問のみ</span>
  </div>
  <section class="panel">
    <h2>スポット一覧 <small id="listCount"></small></h2>
    <div id="listBody"></div>
  </section>
</div>

<!-- エリア別 -->
<div class="page" id="page-area">
  <div class="area-grid" id="areaGrid"></div>
  <div id="areaBody"></div>
</div>

<!-- 日別プラン -->
<div class="page" id="page-plan">
  <div class="note-box">各スポットをタップして「日程」を選ぶと、ここに日ごとにまとまります。</div>
  <div id="planBody"></div>
</div>

<div class="note-box">
  <b>データについて：</b>Googleマップ「デフォルト リスト」のうち、タグが🇭🇰 Hong Kongの<span id="noteCount"></span>件です（書き出し日 <span id="noteDate"></span>）。
  カテゴリとエリアは店名から推定したものです。違っていたらカードをタップして直してください。
  ★・行った・日程・メモ・修正内容は、この端末のブラウザに保存されます。
  <br><button class="link-btn" id="resetBtn">保存内容をすべてリセット</button>
</div>
</div>

const EXPORT_DATE = "2026/11/04";

const CATEGORIES = ["飲茶・点心","麺・粥","茶餐廳","焼味・煲仔飯","レストラン","スイーツ","カフェ","ベーカリー","バー","観光・買い物","未分類"];
const CAT_COLOR = Object.fromEntries(CATEGORIES.map((c, i) => [c, `var(--series-${i + 1})`]));
const AREAS = ["中環・上環","湾仔・銅鑼湾","尖沙咀","佐敦・油麻地","旺角・太子","深水埗","その他","未確認"];
const DAYS = ["Day 1","Day 2","Day 3","Day 4","Day 5"];
const STORE_KEY = "hkSpots.v1";

// ---- state (localStorage) ----
let store = {};
try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { store = {}; }
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(store));
const st = id => (store[id] ||= {});
const spot = s => ({ ...s, ...(store[s.id] || {}) });
const allSpots = () => SPOTS.map(spot);

const filters = { cat: null, area: null, star: false, unvisited: false, q: "" };
const openIds = new Set();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const opts = (list, cur, blank) => (blank ? `<option value="">${blank}</option>` : "") +
  list.map(v => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");

function cardHTML(s) {
  const open = openIds.has(s.id);
  return `<div class="card${s.visited ? " visited" : ""}${open ? " open" : ""}" data-id="${s.id}" style="--cat:${CAT_COLOR[s.category] || CAT_COLOR["未分類"]}">
    <div class="card-main" data-act="toggle">
      <button class="icon-btn star${s.star ? " on" : ""}" data-act="star" aria-label="絶対行く">★</button>
      <div class="card-body">
        <div class="card-title">${esc(s.title)}</div>
        <div class="meta">
          <span class="cat">${esc(s.category)}</span>
          <span>${esc(s.area === "未確認" ? "エリア未確認" : s.area)}</span>
          ${s.day ? `<span class="day">${esc(s.day)}</span>` : ""}
          ${s.memo ? `<span class="memo">📝 ${esc(s.memo)}</span>` : ""}
        </div>
      </div>
      <button class="icon-btn check${s.visited ? " on" : ""}" data-act="visited" aria-label="行った">✔</button>
    </div>
    <div class="card-detail">
      <label class="field">日程<select data-field="day">${opts(DAYS, s.day, "未定")}</select></label>
      <label class="field">カテゴリ<select data-field="category">${opts(CATEGORIES, s.category)}</select></label>
      <label class="field">エリア<select data-field="area">${opts(AREAS, s.area)}</select></label>
      <label class="field">メモ<input data-field="memo" value="${esc(s.memo)}" placeholder="例：朝イチ / 予約済み"></label>
      <a class="map-btn" href="${esc(s.url)}" target="_blank" rel="noopener">Googleマップで開く</a>
    </div>
  </div>`;
}

function chips(el, list, key, counts) {
  el.innerHTML = `<span class="chip${filters[key] === null ? " active" : ""}" data-v="">すべて <small>${counts.__all}</small></span>` +
    list.filter(v => counts[v]).map(v => `<span class="chip${filters[key] === v ? " active" : ""}" data-v="${esc(v)}">` +
      (key === "cat" ? `<span class="dot" style="background:${CAT_COLOR[v]}"></span>` : "") +
      `${esc(v)} <small>${counts[v]}</small></span>`).join("");
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => { filters[key] = c.dataset.v || null; render(); });
}

function countBy(list, f) {
  const o = { __all: list.length };
  list.forEach(s => o[f(s)] = (o[f(s)] || 0) + 1);
  return o;
}

function renderList(all) {
  const q = filters.q.trim().toLowerCase();
  const base = all.filter(s => (!q || s.title.toLowerCase().includes(q) || (s.memo || "").toLowerCase().includes(q))
    && (!filters.star || s.star) && (!filters.unvisited || !s.visited));
  chips(document.getElementById("catChips"), CATEGORIES, "cat", countBy(base.filter(s => !filters.area || s.area === filters.area), s => s.category));
  chips(document.getElementById("areaChips"), AREAS, "area", countBy(base.filter(s => !filters.cat || s.category === filters.cat), s => s.area));
  const rows = base.filter(s => (!filters.cat || s.category === filters.cat) && (!filters.area || s.area === filters.area))
    .sort((a, b) => (b.star - a.star) || (a.visited - b.visited) || (CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category)));
  document.getElementById("listCount").textContent = `${rows.length}件`;
  document.getElementById("listBody").innerHTML = rows.length ? rows.map(cardHTML).join("") : `<div class="empty">該当するスポットがありません</div>`;
  document.getElementById("fStar").classList.toggle("active", filters.star);
  document.getElementById("fUnvisited").classList.toggle("active", filters.unvisited);
}

function renderArea(all) {
  const grid = document.getElementById("areaGrid"), body = document.getElementById("areaBody");
  const used = AREAS.filter(a => all.some(s => s.area === a));
  grid.innerHTML = used.map(a => {
    const list = all.filter(s => s.area === a), v = list.filter(s => s.visited).length;
    return `<div class="area-tile" data-a="${esc(a)}"><div class="name">${esc(a)}</div>
      <div class="count">${list.length}件・行った ${v}</div><div class="bar"><div style="width:${list.length ? v / list.length * 100 : 0}%"></div></div></div>`;
  }).join("");
  grid.querySelectorAll(".area-tile").forEach(t => t.onclick = () =>
    document.getElementById("area-" + used.indexOf(t.dataset.a))?.scrollIntoView({ behavior: "smooth", block: "start" }));
  body.innerHTML = used.map((a, i) => {
    const list = all.filter(s => s.area === a).sort((x, y) => (y.star - x.star) || (CATEGORIES.indexOf(x.category) - CATEGORIES.indexOf(y.category)));
    return `<section class="panel" id="area-${i}" style="scroll-margin-top:56px"><h2>${esc(a)} <small>${list.length}件</small></h2>${list.map(cardHTML).join("")}</section>`;
  }).join("");
}

function renderPlan(all) {
  const groups = [...DAYS, ""];
  document.getElementById("planBody").innerHTML = groups.map(d => {
    const list = all.filter(s => (s.day || "") === d);
    if (!d) {
      const stars = list.filter(s => s.star);
      return `<section class="panel"><h2>未定の ★ スポット <small>${stars.length}件</small></h2>${stars.length ? stars.map(cardHTML).join("") : `<div class="empty">★を付けたスポットで日程未定のものはありません</div>`}</section>`;
    }
    return `<section class="panel"><h2>${esc(d)} <small>${list.length}件</small></h2>${list.length ? list.map(cardHTML).join("") : `<div class="empty">まだ予定がありません</div>`}</section>`;
  }).join("");
}

function renderKpis(all) {
  const v = all.filter(s => s.visited).length;
  document.getElementById("kpiTotal").textContent = all.length;
  document.getElementById("kpiVisited").textContent = v;
  document.getElementById("kpiStar").textContent = all.filter(s => s.star).length;
  document.getElementById("kpiPlanned").textContent = all.filter(s => s.day).length;
  document.getElementById("progressBar").style.width = `${all.length ? v / all.length * 100 : 0}%`;
}

function render() {
  const all = allSpots();
  renderKpis(all);
  renderList(all);
  renderArea(all);
  renderPlan(all);
}

// ---- events (delegated) ----
document.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card || e.target.closest(".card-detail")) return;
  const id = card.dataset.id, act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "star") { st(id).star = !spot(SPOTS.find(s => s.id === id)).star; save(); render(); }
  else if (act === "visited") { st(id).visited = !spot(SPOTS.find(s => s.id === id)).visited; save(); render(); }
  else if (act === "toggle") {
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c => c.classList.toggle("open", openIds.has(id)));
  }
});
document.addEventListener("change", e => {
  const f = e.target.dataset.field, card = e.target.closest(".card");
  if (!f || !card) return;
  st(card.dataset.id)[f] = e.target.value; save(); render();
});
document.getElementById("search").addEventListener("input", e => { filters.q = e.target.value; renderList(allSpots()); });
document.getElementById("fStar").onclick = () => { filters.star = !filters.star; render(); };
document.getElementById("fUnvisited").onclick = () => { filters.unvisited = !filters.unvisited; render(); };
document.getElementById("resetBtn").onclick = () => {
  if (confirm("★・行った・日程・メモ・修正内容をすべて消します。よろしいですか？")) { store = {}; save(); render(); }
};

// ---- tabs ----
document.querySelectorAll(".page-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".page-tab").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + btn.dataset.page));
    window.scrollTo({ top: 0 });
  });
});

// ---- theme ----
const themeBtn = document.getElementById("themeToggle");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "ライトモード" : "ダークモード";
}
applyTheme(localStorage.getItem("hkSpots.theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("hkSpots.theme", next); applyTheme(next);
});

document.getElementById("subLine").textContent = `Googleマップ保存リストより ${SPOTS.length}件`;
document.getElementById("noteCount").textContent = SPOTS.length;
document.getElementById("noteDate").textContent = EXPORT_DATE;
render();
</script>
</body>
</html>
